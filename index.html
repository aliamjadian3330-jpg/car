<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Washino Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn';
}

body{
background:linear-gradient(135deg,#0f172a,#111827);
min-height:100vh;
padding:20px;
display:flex;
justify-content:center;
}

.page{
width:100%;
max-width:550px;
display:flex;
flex-direction:column;
gap:20px;
}

.card{
background:#111827;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo h1{
color:#fff;
font-size:42px;
}

.logo span{
color:#38bdf8;
}

.group{
margin-bottom:12px;
}

label{
display:block;
font-size:13px;
color:#cbd5e1;
margin-bottom:6px;
}

input,select{
width:100%;
padding:12px;
border-radius:12px;
border:none;
background:#0b1220;
color:white;
outline:none;
}

.phone{
display:flex;
gap:8px;
}

.prefix{
background:#0b1220;
padding:12px;
border-radius:12px;
color:#38bdf8;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#0ea5e9,#2563eb);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.loader{
display:none;
text-align:center;
color:#38bdf8;
margin-top:10px;
}

.success{
display:none;
margin-top:10px;
background:#16a34a;
padding:12px;
border-radius:12px;
text-align:center;
}

.footer{
background:#0b1220;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:20px;
text-align:center;
color:#94a3b8;
}

.footer h3{
color:#38bdf8;
margin-bottom:10px;
}

.footer a{
color:#cbd5e1;
text-decoration:none;
display:block;
margin-top:5px;
}

</style>
</head>

<body>

<div class="page">

<div class="card">

<div class="logo">
<h1>Wash<span>ino</span></h1>
<p>کارواش سیار حرفه‌ای</p>
</div>

<div class="group">
<label>نام</label>
<input id="name">
</div>

<div class="group">
<label>شماره تماس</label>
<div class="phone">
<div class="prefix">+98</div>
<input id="phone">
</div>
</div>

<div class="group">
<label>نوع خودرو</label>
<select id="car">
<option>سواری</option>
<option>شاسی بلند</option>
<option>وانت</option>
<option>سنگین</option>
</select>
</div>

<div class="group">
<label>مارک خودرو</label>
<input id="brand">
</div>

<div class="group">
<label>سرویس</label>
<select id="service">
<option>معمولی</option>
<option>VIP</option>
<option>پولیش</option>
<option>صفرشویی</option>
</select>
</div>

<div class="group">
<label>تاریخ</label>
<input id="date">
</div>

<div class="group">
<label>ساعت</label>
<input type="time" id="time">
</div>

<button onclick="sendOrder()">ثبت سفارش</button>

<div class="loader" id="loader">📍 در حال دریافت موقعیت...</div>
<div class="success" id="success">✅ سفارش ثبت شد</div>

</div>

<div class="footer">

<h3>Washino</h3>
<p>کارواش سیار در محل شما 🚗</p>

<a href="tel:+989121234567">📞 تماس</a>
<a href="mailto:aliamjadian.3330@gmail.com">📧 ایمیل</a>

</div>

</div>

<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycbxPS3DiK_h_Zc1wN9ovgp-nzCAiw4n0YBI7MNsC_p5EDDPgL89TgpOOtOQq4R-2wth7/exec";

function sendOrder(){

if(!navigator.geolocation){
alert("GPS فعال نیست");
return;
}

document.getElementById("loader").style.display="block";

navigator.geolocation.getCurrentPosition(async function(pos){

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

const locationLink = `https://www.google.com/maps?q=${lat},${lng}`;

const data = {
name:document.getElementById("name").value,
phone:"+98"+document.getElementById("phone").value,
car:document.getElementById("car").value,
brand:document.getElementById("brand").value,
service:document.getElementById("service").value,
date:document.getElementById("date").value,
time:document.getElementById("time").value,
latitude:lat,
longitude:lng,
location:locationLink
};

await fetch(scriptURL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify(data)
});

document.getElementById("loader").style.display="none";
document.getElementById("success").style.display="block";

},function(){

alert("برای ثبت سفارش باید موقعیت را فعال کنید");

});

}

</script>

</body>
</html>
