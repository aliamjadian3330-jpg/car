<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Washino</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn';
}

body{
background:linear-gradient(135deg,#0f172a,#111827);
min-height:100vh;
display:flex;
justify-content:center;
padding:20px;
}

.container{
width:100%;
max-width:520px;
display:flex;
flex-direction:column;
gap:15px;
}

.card{
background:#111827;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

h1{
color:white;
text-align:center;
font-size:40px;
}

h1 span{
color:#38bdf8;
}

label{
display:block;
color:#cbd5e1;
font-size:13px;
margin-bottom:6px;
}

input,select{
width:100%;
padding:12px;
border-radius:12px;
border:none;
background:#0b1220;
color:white;
outline:none;
margin-bottom:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#0ea5e9,#2563eb);
color:white;
font-weight:bold;
cursor:pointer;
}

.footer{
background:#0b1220;
padding:20px;
border-radius:20px;
text-align:center;
color:#94a3b8;
}

.footer a{
color:#38bdf8;
text-decoration:none;
display:block;
margin-top:5px;
}

.toast{
position:fixed;
bottom:20px;
right:20px;
left:20px;
margin:auto;
max-width:420px;
background:#111827;
color:white;
padding:14px;
border-radius:12px;
text-align:center;
opacity:0;
transform:translateY(20px);
transition:0.4s;
}

.toast.show{
opacity:1;
transform:translateY(0);
}

.toast.success{border-right:4px solid #22c55e;}
.toast.error{border-right:4px solid #ef4444;}
.toast.loading{border-right:4px solid #3b82f6;}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Wash<span>ino</span></h1>

<label>نام</label>
<input id="name">

<label>شماره تماس</label>
<input id="phone">

<label>نوع خودرو</label>
<select id="car">
<option>سواری</option>
<option>شاسی بلند</option>
<option>وانت</option>
<option>سنگین</option>
</select>

<label>مارک خودرو</label>
<input id="brand">

<label>سرویس</label>
<select id="service">
<option>معمولی</option>
<option>VIP</option>
<option>پولیش</option>
<option>صفرشویی</option>
</select>

<label>تاریخ</label>
<input id="date">

<label>ساعت</label>
<input type="time" id="time">

<label>آدرس دستی</label>
<input id="address">

<button onclick="sendOrder()">ثبت سفارش</button>

</div>

<div class="footer">
<h3>Washino</h3>
<p>کارواش سیار در محل شما 🚗</p>
<a href="tel:+989121234567">📞 تماس</a>
<a href="mailto:aliamjadian.3330@gmail.com">📧 ایمیل</a>
</div>

</div>

<div id="toast" class="toast"></div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbxPS3DiK_h_Zc1wN9ovgp-nzCAiw4n0YBI7MNsC_p5EDDPgL89TgpOOtOQq4R-2wth7/exec";

function showToast(msg,type="success"){
const t=document.getElementById("toast");
t.innerText=msg;
t.className="toast show "+type;
setTimeout(()=>t.className="toast",10000);
}

function sendOrder(){

showToast("📍 دریافت موقعیت...", "loading");

if(!navigator.geolocation){
showToast("❌ GPS فعال نیست","error");
return;
}

navigator.geolocation.getCurrentPosition(async (pos)=>{

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;

const location=`https://www.google.com/maps?q=${lat},${lng}`;

const data={
name:document.getElementById("name").value,
phone:document.getElementById("phone").value,
car:document.getElementById("car").value,
brand:document.getElementById("brand").value,
service:document.getElementById("service").value,
date:document.getElementById("date").value,
time:document.getElementById("time").value,
address:document.getElementById("address").value,
latitude:lat,
longitude:lng,
location:location
};

await fetch(scriptURL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify(data)
});

showToast(" سفارش شما با موفقیت در حال ثبت است⏳ لطفاً منتظر تماس کارواش باشید📞 در صورت عدم تماس، با پشتیبانی Washino در ارتباط باشید", "success");

},()=>{
showToast("📍 لطفاً موقعیت را فعال کنید","error");
});

}

</script>

</body>
</html>
